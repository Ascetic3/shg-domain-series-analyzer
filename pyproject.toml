[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shg-domain-analyzer"
version = "0.1.1"
description = "Portfolio GUI for neutral measurement of periodic bright bands and dark intervals."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PySide6>=6.7",
    "tifffile>=2024.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["pyinstaller>=6"]

[project.scripts]
shg-domain-analyzer = "shg_domain_analyzer.gui.main_window:main"
shg-series-analyzer = "shg_domain_analyzer.gui.main_window:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
